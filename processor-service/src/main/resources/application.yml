server:
  port: 8081

banksim:
  # Where outcomes are pushed. Leave empty to keep them in this service only.
  reconciliation-url: http://localhost:8082
  # Chance, from 0 to 1, that one processing attempt fails. Each message gets 3 attempts.
  position-failure-rate: 0.4
  payment-failure-rate: 0.3

spring:
  main:
    banner-mode: off
    log-startup-info: false

banksim:
  # Where the processor service listens.
  processor-url: http://localhost:8081
  # Wait before the first retry when the processor cannot be reached. It doubles each retry, up to 5 attempts.
  first-retry-wait: 1s

spring:
  http:
    clients:
      # Give up waiting for a reply after this long. Without it, a processor that never replies hangs the bank.
      read-timeout: 2s
  main:
    banner-mode: off
    log-startup-info: false
